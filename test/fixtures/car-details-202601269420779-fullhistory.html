NGINESIZELITRES\"},{\"label\":\"Gearbox\",\"value\":\"Automatic\",\"specKey\":\"GEARBOX\"},{\"label\":\"Doors\",\"value\":\"5\",\"specKey\":\"DOORS\"},{\"label\":\"Seats\",\"value\":\"5\",\"specKey\":\"SEATS\"},{\"label\":\"Body colour\",\"value\":\"Blue\",\"specKey\":\"BODYCOLOUR\"},{\"label\":\"Service history\",\"value\":\"Full\",\"specKey\":\"SERVICEHISTORY\"}],\"featuresHighlights\":[],\"vehicleHighlights\":[],\"specs\":[{\"category\":\"Size and dimensions\",\"count\":\"1\",\"items\":[{\"name\":\"Seats\",\"value\":\"5\"}]}],\"featuresWithDisclaimer\":{\"disclaimers\":[{\"title\":\"Please note:\",\"key\":\"features and specs\",\"value\":[\"This data has been supplied by the seller of the vehicle. We recommend that you always check these details with them before purchase.\",\"Autotrader Intelligence has sorted these features into categories that may not always be accurate. Any features that could not be matched to a category can be found under ‘other’.\",\"Auto Trader Limited, or its data supplier, will not accept liability for any information provided.\"]}],\"features\":[{\"title\":\"Exterior\",\"category\":\"Exterior\",\"count\":\"1\",\"items\":[{\"name\":\"Blue exterior colour\",\"type\":\"Standard\"}]},{\"title\":\"Interior\",\"category\":\"Interior\",\"count\":\"1\",\"items\":[{\"name\":\"Beige part leather interior\",\"type\":\"Standard\"}]},{\"title\":\"Other\",\"category\":\"Other\",\"count\":\"15\",\"items\":[{\"name\":\"3x3 point rear seat belts\",\"type\":\"Standard\"},{\"name\":\"Air conditioning\",\"type\":\"Standard\"},{\"name\":\"Airbags\",\"type\":\"Standard\"},{\"name\":\"Alarm\",\"type\":\"Standard\"},{\"name\":\"Alloy wheels\",\"type\":\"Standard\"},{\"name\":\"CD Player\",\"type\":\"Standard\"},{\"name\":\"Central locking\",\"type\":\"Standard\"},{\"name\":\"Child locks \u0026 Isofix system\",\"type\":\"Standard\"},{\"name\":\"Electric windows\",\"type\":\"Standard\"},{\"name\":\"Leather seats\",\"type\":\"Standard\"},{\"name\":\"Power steering\",\"type\":\"Standard\"},{\"name\":\"Radio\",\"type\":\"Standard\"},{\"name\":\"Remote central locking\",\"type\":\"Standard\"},{\"name\":\"Satellite navigation\",\"type\":\"Standard\"},{\"name\":\"Sunroof\",\"type\":\"Standard\"}]}]},\"finance\":{\"pcpInfo\":{\"heading\":\"Learn more about Personal contract purchase (PCP)\",\"video\":{\"url\":\"https://vimeo.com/637959800/417871703d\",\"description\":\"The following video explains what is Personal contract purchase (PCP) when it comes to finance options.\"},\"summary\":{\"heading\":\"What is PCP finance?\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Personal contract purchase (PCP) is a flexible way to finance a vehicle. You pay an initial deposit, followed by monthly payments including interest. At the end of the agreement you then have three options:\"},{\"type\":\"BULLET\",\"value\":\"Buy the vehicle by paying the optional final payment (also known as a balloon payment)\"},{\"type\":\"BULLET\",\"value\":\"Return the vehicle and walk away\"},{\"type\":\"BULLET\",\"value\":\"Or get a new vehicle on a new agreement. Terms and conditions will apply, and there may be additional fees.\"}]},\"questions\":[{\"heading\":\"What are the benefits of PCP finance?\",\"trackingLabel\":\"benefits-pcp\",\"content\":[{\"type\":\"BULLET\",\"value\":\"If you’re thinking of changing your car in a few years’ time, PCP could be the most suitable way to finance your car\"},{\"type\":\"BULLET\",\"value\":\"Generally, you’ll pay a fixed amount each month, so you can budget easily\"},{\"type\":\"BULLET\",\"value\":\"The options are open-ended, so there is more flexibility to either:\"},{\"type\":\"SUB_BULLET\",\"value\":\"Pay what’s left of the vehicle’s value at the end of the agreement (also known as a balloon payment or GMFV - Guaranteed Minimum Future Value) to own the car\"},{\"type\":\"SUB_BULLET\",\"value\":\"Hand the car back to the lender and walk away (as long as the car is not damaged and you have not gone over your agreed mileage allowance)\"},{\"type\":\"SUB_BULLET\",\"value\":\"Part exchange the car for your next vehicle purchase. If the car is worth more than the GMFV at this point, you can use this additional value towards a deposit on your next car. Monthly payments are usually lower than with other finance types like HP and CS.\"},{\"type\":\"BULLET\",\"value\":\"You can choose from lots of cars, and you can easily change cars at the end of your contract if you fancy something different\"},{\"type\":\"BULLET\",\"value\":\"Some PCP agreements include servicing and maintenance. Convenient!\"},{\"type\":\"BULLET\",\"value\":\"Dealers and manufacturers sometimes offer useful deals on PCP contracts, including help towards your deposit\"}]},{\"heading\":\"Are there any disadvantages of PCP finance?\",\"trackingLabel\":\"disadvantages-pcp\",\"content\":[{\"type\":\"BULLET\",\"value\":\"You may need a higher deposit for PCP than you would for HP/CS\"},{\"type\":\"BULLET\",\"value\":\"You don’t own the car until you pay the optional final payment. Until this point, the finance company owns the car and you are classed as its legal keeper.\"},{\"type\":\"BULLET\",\"value\":\"The car may be repossessed if you don’t keep up with payments or if you breach any terms of the agreement\"},{\"type\":\"BULLET\",\"value\":\"A seller may offer a 0% APR deal. This sometimes means there is a bigger final payment (balloon payment) or higher charges for excess mileage or damage.\"},{\"type\":\"BULLET\",\"value\":\"The car can’t be sold before you make your final payment, unless you contact the finance company and agree a termination value\"},{\"type\":\"BULLET\",\"value\":\"You can’t sell or modify the car without permission, until you are the legal owner\"},{\"type\":\"BULLET\",\"value\":\"You could be charged additional fees if you go over your pre-arranged yearly mileage limit and want to hand the car back\"},{\"type\":\"BULLET\",\"value\":\"You will have to pay for repairs if you damage the car and want to hand the car back\"},{\"type\":\"BULLET\",\"value\":\"If you know you want to own the car at the end of your finance period, HP (Hire Purchase) or a personal loan is often a cheaper option\"}]},{\"heading\":\"What will I need when applying for PCP finance?\",\"trackingLabel\":\"applying-for-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"To apply for a PCP (Personal Contract Purchase) finance agreement, you’ll need an up-to-date credit history report, proof of address, proof of income, ID, driving licence and personal details such as your legal name and address. You must be 18 years or over and be a permanent UK resident.\"}]},{\"heading\":\"Do I need a credit check for PCP finance?\",\"trackingLabel\":\"credit-check-for-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Yes, the lender will perform a credit check with credit reference agencies when you apply. This will appear on your credit file as an application for credit – Please note: too many checks in a short space of time can affect your credit rating so try to avoid that if possible.\"}]},{\"heading\":\"Am I responsible for tax and insurance?\",\"trackingLabel\":\"tax-insurance-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Yes, you will be responsible for the car’s upkeep including insurance and tax. Some PCP deals include insurance, but most don’t, so make sure you check this.\"},{\"type\":\"TEXT\",\"value\":\"You may need a comprehensive insurance premium, as the car belongs to the lender, so factor this into your budget as this can be expensive.\"},{\"type\":\"TEXT\",\"value\":\"You’ll also be responsible for the car’s annual MOT and servicing if it’s over three years old.\"}]},{\"heading\":\"What is maintenance and fair wear and tear?\",\"trackingLabel\":\"wear-tear-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Remember you do not own the car until you pay the final optional payment. This means the car will need to be in good condition if you decide to hand the car back or swap it.\"},{\"type\":\"TEXT\",\"value\":\"Fair wear and tear, such as worn fabric on the seats, is fine, but you’ll likely be asked to pay to repair on large scratches, dents or other damage on the car.\"},{\"type\":\"TEXT\",\"value\":\"If you damage the car while driving it, check your contract to see where you can take it for repairs. If you’ve got a deal with the manufacturer, they may stipulate that you visit an approved servicingcentre. Failure to do so could void your warranty.\"}]},{\"heading\":\"Can I end a PCP contract early?\",\"trackingLabel\":\"end-pcp-early\",\"content\":[{\"type\":\"TEXT\",\"value\":\"You have the right to end your finance agreement and you can do so at any time and for any reason. (e.g. you might decide you are unable to make the monthly payments).\"},{\"type\":\"TEXT\",\"value\":\"To end your contract you would need to write to the finance company that you make your payments to. You will need to pay 50% (half) of the total amount payable (this will be shown on your original agreement) AND you will need to return the car. If you have already paid at least this amount plus any overdue payments and have taken reasonable care of the car, you will not have to pay any more. You will not receive any refund of any payments you have made up to or beyond that point.\"},{\"type\":\"TEXT\",\"value\":\"This is known as Voluntary Termination (VT) and, if you do not fully repay what you owe under your agreement, this could be recorded with the credit reference agencies and may have an effect on your ability to borrow in the future.\"}]}]},\"hpCsInfo\":{\"heading\":\"Learn more about Hire purchase (HP) / Conditional sale (CS)\",\"video\":{\"url\":\"https://vimeo.com/638697359/732687ad82\",\"description\":\"The following video explains what is Hire purchase (HP) / Conditional sale (CS) when it comes to finance options.\"},\"videoUrl\":\"https://vimeo.com/638697359/732687ad82\",\"summary\":{\"heading\":\"What is HP/CS finance?\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Hire purchase (HP) / Conditional sale (CS) is a flexible way to finance a vehicle. You pay a deposit upfront, then make monthly payments to pay off the remaining amount, plus interest and an additional fees. With HP/CS, you will own the vehicle at the end of the agreement.\"}]},\"questions\":[{\"heading\":\"What are the benefits of HP/CS finance?\",\"trackingLabel\":\"benefits-hp-cs\",\"content\":[{\"type\":\"BULLET\",\"value\":\"You can own the car outright at the end of your agreement, once you have paid your ‘Option to purchase fee’ (a nominal fee to transfer ownership of the car into your name)\"},{\"type\":\"BULLET\",\"value\":\"HP and CS agreements generally offer equal monthly payments and fixed interest rates, which makes them easy to budget for. Some HP/CS agreements do, however, include a larger final value to pay, which will be explained to you if applicable.\"},{\"type\":\"BULLET\",\"value\":\"The deposit you put down can be relatively low, often around 10% of the car’s value, though some lenders may require a minimum deposit amount\"},{\"type\":\"BULLET\",\"value\":\"Flexible contract lengths and repayment terms mean you can find a contract length and price that suits you\"},{\"type\":\"BULLET\",\"value\":\"Buying through HP/CS gives you some extra protection for a period of time if there’s a problem with the car\"},{\"type\":\"BULLET\",\"value\":\"Unlike with a PCP agreement, you’re not limited to mileage restrictions or other conditions (like wear and tear). You are simply required to keep the car serviced and in good condition until you legally own the car at the end of your agreement.\"}]},{\"heading\":\"Are there any disadvantages of HP/CS finance?\",\"trackingLabel\":\"disadvantages-hp-cs\",\"content\":[{\"type\":\"BULLET\",\"value\":\"Monthly payments are generally higher than with other types of finance products like PCP\"},{\"type\":\"BULLET\",\"value\":\"The car is at risk of repossession if you breach any terms of the agreement or if you don’t maintain your repayments\"},{\"type\":\"BULLET\",\"value\":\"The car can’t be sold before you make your final payment and interest, unless you contact the finance company and agree to pay a termination value\"},{\"type\":\"BULLET\",\"value\":\"You can’t sell or modify the car without permission from the finance provider, until you are the legal owner\"},{\"type\":\"BULLET\",\"value\":\"You don’t own the car until you pay the final payment (including the ‘Option to Purchase fee’ if applicable). Until this point, the finance company owns the car and you are classed as its legal keeper, not the owner.\"}]},{\"heading\":\"What will I need when applying for HP/CS finance?\",\"trackingLabel\":\"applying-for-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"To apply for a HP (Hire Purchase) or CS (Conditional Sale) finance agreement, you’ll need an up-to-date credit history report, proof of address, proof of income, ID, driving licence and personal details such as your legal name and address. You must be 18 years or over and a permanent resident of the UK.\"}]},{\"heading\":\"Do I need a credit check for HP/CS finance?\",\"trackingLabel\":\"credit-check-for-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Yes, the lender will perform a credit check with credit reference agencies when you apply. This will appear on your credit file as an application for credit – too many checks in a short space of time can affect your credit rating so try to avoid that if possible.\"}]},{\"heading\":\"What’s the difference between HP (Hire Purchase) and CS (Conditional Sale)?\",\"trackingLabel\":\"difference-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"The main difference between Hire Purchase and Conditional Sale contracts is that CS contracts do not include a final ‘Option to Purchase’ fee, like you get with an HP contract. Instead, with a CS contract it is a condition that you purchase the car from the beginning, and you will automatically become the vehicle owner once you’ve made all your agreed monthly repayments to the lender.\"}]},{\"heading\":\"What is the ‘Option to Purchase’ fee on HP contracts?\",\"trackingLabel\":\"option-to-purchase-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Once you’ve made all your agreed monthly payments, you may have one final ‘Option to Purchase’ fee to pay before you officially own the car. This can sometimes be build into your final monthly payment, or sometimes it is simply a very small, nominal fee. You will find this payment amount detailed in your contract before you sign it.\"}]},{\"heading\":\"Can I end a HP or CS contract early?\",\"trackingLabel\":\"end-hp-cs-early\",\"content\":[{\"type\":\"TEXT\",\"value\":\"You have the right to end your finance agreement and you can do so at any time and for any reason. (e.g. you might decide you are unable to make the monthly payments).\"},{\"type\":\"TEXT\",\"value\":\"To end your contract you would need to write to the finance company that you make your payments to. You will need to pay 50% (half) of the total amount payable (this will be shown on your original agreement) AND you will need to return the car. If you have already paid at least this amount plus any overdue payments and have taken reasonable care of the car, you will not have to pay any more. You will not receive any refund of any payments you have made up to or beyond that point.\"},{\"type\":\"TEXT\",\"value\":\"This is known as Voluntary Termination (VT) and, if you do not fully repay what you owe under your agreement, this could be recorded with the credit reference agencies and may have an effect on your ability to borrow in the future.\"}]},{\"heading\":\"Can HP or CS contracts be transferred?\",\"trackingLabel\":\"transfer-contracts-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"You cannot transfer a HP or CS contract to anybody else. Your contract would be written specifically for you, taking your finances, credit rating and other factors into consideration. Fo
