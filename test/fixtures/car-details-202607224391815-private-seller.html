me\":\"Signature LED Headlights with LED Daytime Running Lights\",\"type\":\"Standard\"}]},{\"title\":\"Interior\",\"category\":\"Interior\",\"count\":\"9\",\"items\":[{\"name\":\"Air Conditioning - Climate Control\",\"type\":\"Standard\"},{\"name\":\"Courtesy Light with Integrated Spotlight\",\"type\":\"Standard\"},{\"name\":\"Engine Start-Stop Button\",\"type\":\"Standard\"},{\"name\":\"Gear Knob - Leather\",\"type\":\"Standard\"},{\"name\":\"Handbrake - Leather Wrapped\",\"type\":\"Standard\"},{\"name\":\"Luggage Compartment - Light\",\"type\":\"Standard\"},{\"name\":\"Seats - 60-40 Split Folding Rear\",\"type\":\"Standard\"},{\"name\":\"Sunvisors - Drivers and Front Passengers with Covered Vanity Mirror and Drivers Ticket Holder\",\"type\":\"Standard\"},{\"name\":\"Three Height Adjustable Rear Head Restraints\",\"type\":\"Standard\"}]},{\"title\":\"Safety and Security\",\"category\":\"Safety and Security\",\"count\":\"12\",\"items\":[{\"name\":\"Dynamic Stability Control - DSC - with Traction Control System - TCS\",\"type\":\"Standard\"},{\"name\":\"Front Passenger Airbag Cut-Off Switch\",\"type\":\"Standard\"},{\"name\":\"G-Vectoring Control Plus - GVC Plus\",\"type\":\"Standard\"},{\"name\":\"Lane Keep Assist System\",\"type\":\"Standard\"},{\"name\":\"SKYACTIV-Body Engineered Triple H Body Structure to Help Protect Occupants from Impact Forces\",\"type\":\"Standard\"},{\"name\":\"Seatbelt Reminder Audible Warning\",\"type\":\"Standard\"},{\"name\":\"Seatbelts - Front - 3 Point - ELR x 2 with Pre-Tensioners\",\"type\":\"Standard\"},{\"name\":\"Seatbelts - Rear - 3-point - ELR x 2 with Pre-tensioners\",\"type\":\"Standard\"},{\"name\":\"Smart City Brake Support - Front Only\",\"type\":\"Standard\"},{\"name\":\"Smart Keyless Entry\",\"type\":\"Standard\"},{\"name\":\"Thatcham Accredited Alarm and Immobiliser\",\"type\":\"Standard\"},{\"name\":\"Wipers - Rear Adjustable Speed with Intermittent\",\"type\":\"Standard\"}]}]},\"runningCosts\":{\"title\":\"Running Costs\",\"runningCostList\":[{\"key\":\"Fuel\",\"items\":[{\"name\":\"Average\",\"value\":\"47.9mpg\",\"paragraphs\":[\"Urban and extra urban combined\"]}]},{\"key\":\"Insurance\",\"items\":[{\"name\":\"Insurance group\",\"value\":\"15E\"}]},{\"key\":\"Tax\",\"items\":[{\"name\":\"Tax per year\",\"value\":\"£200*\",\"disclaimers\":[\"* If the list price of a car is over £40,000, then an extra £425 will be payable from the second time the vehicle is taxed for up to 5 years\"]},{\"name\":\"CO₂ emissions\",\"value\":\"133g/km\"}]}]},\"runningCostsV2\":{\"title\":\"Running Costs\",\"items\":[{\"key\":\"Emission\",\"label\":\"CO₂ emissions\",\"value\":\"133g/km\"},{\"key\":\"Insurance\",\"label\":\"Insurance group\",\"value\":\"15E\"},{\"key\":\"TAX_WITH_DISCLAIMER\",\"label\":\"Tax per year\",\"value\":\"£200*\",\"disclaimers\":[\"* If the list price of a car is over £40,000, then an extra £425 will be payable from the second time the vehicle is taxed for up to 5 years\"]},{\"key\":\"FUEL_AVERAGE\",\"label\":\"Average\",\"value\":\"47.9mpg\"}]},\"finance\":{\"pcpInfo\":{\"heading\":\"Learn more about Personal contract purchase (PCP)\",\"video\":{\"url\":\"https://vimeo.com/637959800/417871703d\",\"description\":\"The following video explains what is Personal contract purchase (PCP) when it comes to finance options.\"},\"summary\":{\"heading\":\"What is PCP finance?\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Personal contract purchase (PCP) is a flexible way to finance a vehicle. You pay an initial deposit, followed by monthly payments including interest. At the end of the agreement you then have three options:\"},{\"type\":\"BULLET\",\"value\":\"Buy the vehicle by paying the optional final payment (also known as a balloon payment)\"},{\"type\":\"BULLET\",\"value\":\"Return the vehicle and walk away\"},{\"type\":\"BULLET\",\"value\":\"Or get a new vehicle on a new agreement. Terms and conditions will apply, and there may be additional fees.\"}]},\"questions\":[{\"heading\":\"What are the benefits of PCP finance?\",\"trackingLabel\":\"benefits-pcp\",\"content\":[{\"type\":\"BULLET\",\"value\":\"If you’re thinking of changing your car in a few years’ time, PCP could be the most suitable way to finance your car\"},{\"type\":\"BULLET\",\"value\":\"Generally, you’ll pay a fixed amount each month, so you can budget easily\"},{\"type\":\"BULLET\",\"value\":\"The options are open-ended, so there is more flexibility to either:\"},{\"type\":\"SUB_BULLET\",\"value\":\"Pay what’s left of the vehicle’s value at the end of the agreement (also known as a balloon payment or GMFV - Guaranteed Minimum Future Value) to own the car\"},{\"type\":\"SUB_BULLET\",\"value\":\"Hand the car back to the lender and walk away (as long as the car is not damaged and you have not gone over your agreed mileage allowance)\"},{\"type\":\"SUB_BULLET\",\"value\":\"Part exchange the car for your next vehicle purchase. If the car is worth more than the GMFV at this point, you can use this additional value towards a deposit on your next car. Monthly payments are usually lower than with other finance types like HP and CS.\"},{\"type\":\"BULLET\",\"value\":\"You can choose from lots of cars, and you can easily change cars at the end of your contract if you fancy something different\"},{\"type\":\"BULLET\",\"value\":\"Some PCP agreements include servicing and maintenance. Convenient!\"},{\"type\":\"BULLET\",\"value\":\"Dealers and manufacturers sometimes offer useful deals on PCP contracts, including help towards your deposit\"}]},{\"heading\":\"Are there any disadvantages of PCP finance?\",\"trackingLabel\":\"disadvantages-pcp\",\"content\":[{\"type\":\"BULLET\",\"value\":\"You may need a higher deposit for PCP than you would for HP/CS\"},{\"type\":\"BULLET\",\"value\":\"You don’t own the car until you pay the optional final payment. Until this point, the finance company owns the car and you are classed as its legal keeper.\"},{\"type\":\"BULLET\",\"value\":\"The car may be repossessed if you don’t keep up with payments or if you breach any terms of the agreement\"},{\"type\":\"BULLET\",\"value\":\"A seller may offer a 0% APR deal. This sometimes means there is a bigger final payment (balloon payment) or higher charges for excess mileage or damage.\"},{\"type\":\"BULLET\",\"value\":\"The car can’t be sold before you make your final payment, unless you contact the finance company and agree a termination value\"},{\"type\":\"BULLET\",\"value\":\"You can’t sell or modify the car without permission, until you are the legal owner\"},{\"type\":\"BULLET\",\"value\":\"You could be charged additional fees if you go over your pre-arranged yearly mileage limit and want to hand the car back\"},{\"type\":\"BULLET\",\"value\":\"You will have to pay for repairs if you damage the car and want to hand the car back\"},{\"type\":\"BULLET\",\"value\":\"If you know you want to own the car at the end of your finance period, HP (Hire Purchase) or a personal loan is often a cheaper option\"}]},{\"heading\":\"What will I need when applying for PCP finance?\",\"trackingLabel\":\"applying-for-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"To apply for a PCP (Personal Contract Purchase) finance agreement, you’ll need an up-to-date credit history report, proof of address, proof of income, ID, driving licence and personal details such as your legal name and address. You must be 18 years or over and be a permanent UK resident.\"}]},{\"heading\":\"Do I need a credit check for PCP finance?\",\"trackingLabel\":\"credit-check-for-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Yes, the lender will perform a credit check with credit reference agencies when you apply. This will appear on your credit file as an application for credit – Please note: too many checks in a short space of time can affect your credit rating so try to avoid that if possible.\"}]},{\"heading\":\"Am I responsible for tax and insurance?\",\"trackingLabel\":\"tax-insurance-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Yes, you will be responsible for the car’s upkeep including insurance and tax. Some PCP deals include insurance, but most don’t, so make sure you check this.\"},{\"type\":\"TEXT\",\"value\":\"You may need a comprehensive insurance premium, as the car belongs to the lender, so factor this into your budget as this can be expensive.\"},{\"type\":\"TEXT\",\"value\":\"You’ll also be responsible for the car’s annual MOT and servicing if it’s over three years old.\"}]},{\"heading\":\"What is maintenance and fair wear and tear?\",\"trackingLabel\":\"wear-tear-pcp\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Remember you do not own the car until you pay the final optional payment. This means the car will need to be in good condition if you decide to hand the car back or swap it.\"},{\"type\":\"TEXT\",\"value\":\"Fair wear and tear, such as worn fabric on the seats, is fine, but you’ll likely be asked to pay to repair on large scratches, dents or other damage on the car.\"},{\"type\":\"TEXT\",\"value\":\"If you damage the car while driving it, check your contract to see where you can take it for repairs. If you’ve got a deal with the manufacturer, they may stipulate that you visit an approved servicingcentre. Failure to do so could void your warranty.\"}]},{\"heading\":\"Can I end a PCP contract early?\",\"trackingLabel\":\"end-pcp-early\",\"content\":[{\"type\":\"TEXT\",\"value\":\"You have the right to end your finance agreement and you can do so at any time and for any reason. (e.g. you might decide you are unable to make the monthly payments).\"},{\"type\":\"TEXT\",\"value\":\"To end your contract you would need to write to the finance company that you make your payments to. You will need to pay 50% (half) of the total amount payable (this will be shown on your original agreement) AND you will need to return the car. If you have already paid at least this amount plus any overdue payments and have taken reasonable care of the car, you will not have to pay any more. You will not receive any refund of any payments you have made up to or beyond that point.\"},{\"type\":\"TEXT\",\"value\":\"This is known as Voluntary Termination (VT) and, if you do not fully repay what you owe under your agreement, this could be recorded with the credit reference agencies and may have an effect on your ability to borrow in the future.\"}]}]},\"hpCsInfo\":{\"heading\":\"Learn more about Hire purchase (HP) / Conditional sale (CS)\",\"video\":{\"url\":\"https://vimeo.com/638697359/732687ad82\",\"description\":\"The following video explains what is Hire purchase (HP) / Conditional sale (CS) when it comes to finance options.\"},\"videoUrl\":\"https://vimeo.com/638697359/732687ad82\",\"summary\":{\"heading\":\"What is HP/CS finance?\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Hire purchase (HP) / Conditional sale (CS) is a flexible way to finance a vehicle. You pay a deposit upfront, then make monthly payments to pay off the remaining amount, plus interest and an additional fees. With HP/CS, you will own the vehicle at the end of the agreement.\"}]},\"questions\":[{\"heading\":\"What are the benefits of HP/CS finance?\",\"trackingLabel\":\"benefits-hp-cs\",\"content\":[{\"type\":\"BULLET\",\"value\":\"You can own the car outright at the end of your agreement, once you have paid your ‘Option to purchase fee’ (a nominal fee to transfer ownership of the car into your name)\"},{\"type\":\"BULLET\",\"value\":\"HP and CS agreements generally offer equal monthly payments and fixed interest rates, which makes them easy to budget for. Some HP/CS agreements do, however, include a larger final value to pay, which will be explained to you if applicable.\"},{\"type\":\"BULLET\",\"value\":\"The deposit you put down can be relatively low, often around 10% of the car’s value, though some lenders may require a minimum deposit amount\"},{\"type\":\"BULLET\",\"value\":\"Flexible contract lengths and repayment terms mean you can find a contract length and price that suits you\"},{\"type\":\"BULLET\",\"value\":\"Buying through HP/CS gives you some extra protection for a period of time if there’s a problem with the car\"},{\"type\":\"BULLET\",\"value\":\"Unlike with a PCP agreement, you’re not limited to mileage restrictions or other conditions (like wear and tear). You are simply required to keep the car serviced and in good condition until you legally own the car at the end of your agreement.\"}]},{\"heading\":\"Are there any disadvantages of HP/CS finance?\",\"trackingLabel\":\"disadvantages-hp-cs\",\"content\":[{\"type\":\"BULLET\",\"value\":\"Monthly payments are generally higher than with other types of finance products like PCP\"},{\"type\":\"BULLET\",\"value\":\"The car is at risk of repossession if you breach any terms of the agreement or if you don’t maintain your repayments\"},{\"type\":\"BULLET\",\"value\":\"The car can’t be sold before you make your final payment and interest, unless you contact the finance company and agree to pay a termination value\"},{\"type\":\"BULLET\",\"value\":\"You can’t sell or modify the car without permission from the finance provider, until you are the legal owner\"},{\"type\":\"BULLET\",\"value\":\"You don’t own the car until you pay the final payment (including the ‘Option to Purchase fee’ if applicable). Until this point, the finance company owns the car and you are classed as its legal keeper, not the owner.\"}]},{\"heading\":\"What will I need when applying for HP/CS finance?\",\"trackingLabel\":\"applying-for-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"To apply for a HP (Hire Purchase) or CS (Conditional Sale) finance agreement, you’ll need an up-to-date credit history report, proof of address, proof of income, ID, driving licence and personal details such as your legal name and address. You must be 18 years or over and a permanent resident of the UK.\"}]},{\"heading\":\"Do I need a credit check for HP/CS finance?\",\"trackingLabel\":\"credit-check-for-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Yes, the lender will perform a credit check with credit reference agencies when you apply. This will appear on your credit file as an application for credit – too many checks in a short space of time can affect your credit rating so try to avoid that if possible.\"}]},{\"heading\":\"What’s the difference between HP (Hire Purchase) and CS (Conditional Sale)?\",\"trackingLabel\":\"difference-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"The main difference between Hire Purchase and Conditional Sale contracts is that CS contracts do not include a final ‘Option to Purchase’ fee, like you get with an HP contract. Instead, with a CS contract it is a condition that you purchase the car from the beginning, and you will automatically become the vehicle owner once you’ve made all your agreed monthly repayments to the lender.\"}]},{\"heading\":\"What is the ‘Option to Purchase’ fee on HP contracts?\",\"trackingLabel\":\"option-to-purchase-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"Once you’ve made all your agreed monthly payments, you may have one final ‘Option to Purchase’ fee to pay before you officially own the car. This can sometimes be build into your final monthly payment, or sometimes it is simply a very small, nominal fee. You will find this payment amount detailed in your contract before you sign it.\"}]},{\"heading\":\"Can I end a HP or CS contract early?\",\"trackingLabel\":\"end-hp-cs-early\",\"content\":[{\"type\":\"TEXT\",\"value\":\"You have the right to end your finance agreement and you can do so at any time and for any reason. (e.g. you might decide you are unable to make the monthly payments).\"},{\"type\":\"TEXT\",\"value\":\"To end your contract you would need to write to the finance company that you make your payments to. You will need to pay 50% (half) of the total amount payable (this will be shown on your original agreement) AND you will need to return the car. If you have already paid at least this amount plus any overdue payments and have taken reasonable care of the car, you will not have to pay any more. You will not receive any refund of any payments you have made up to or beyond that point.\"},{\"type\":\"TEXT\",\"value\":\"This is known as Voluntary Termination (VT) and, if you do not fully repay what you owe under your agreement, this could be recorded with the credit reference agencies and may have an effect on your ability to borrow in the future.\"}]},{\"heading\":\"Can HP or CS contracts be transferred?\",\"trackingLabel\":\"transfer-contracts-hp-cs\",\"content\":[{\"type\":\"TEXT\",\"value\":\"You cannot transfer a HP or CS contract to anybody else. Your contract would be written specifically for you, taking your finances, credit rating and other factors into consideration. For this reason, it would not be applicable to someone else. If someone wants to buy your car before you become the legal owner, you’d have to settle your contract first.\"}]}]}},\"gallery\":{\"title\":\"Mazda Mazda2\",\"price\":\"£8,000\",\"images\":[{\"url\":\"https://m.atcdn.co.uk/a/media/{resize}/0d30d608b5944855a3fe1467915ef752.jpg\",\"classificationTags\":[{\"label\":\"Front\",\"category\":\"Exterior\"}]},{\"url\":\"https://m.atcdn.co.uk/a/media/{resize}/189414e701a840089201a557a28aceeb.jpg\",\"classificationTags\":[{\"label\":\"Interior Front\",\"category\":\"Interior\"}]},{\"url\":\"https://m.atcdn.co.uk/a/media/{resize}/e1c5ff68279a469b94b4e5dc8a6548e9.jpg\",\"classificationTags\":[{\"label\":\"Interior Front\",\"category\":\"Interior\"}]},{\"url\":\"https://m.atcdn.co.uk/a/media/{resize}/311fb6781dfb478da41927b5d148edae.jpg\",\"classificationTags\":[{\"label\":\"Seats Rear\",\"category\":\"Interior\"}]},{\"url\":\"https://m.atcdn.co.uk/a/media/{resize}/1acb2ff9058f4b4289c112c2961f1d09.jpg\",\"classificationTags\":[{\"label\":\"Driver Instruments\",\"category\":\"Interior\"}]},{\"url\":\"https://m.atcdn.co.uk/a/media/{resize}/cd3e178d21fa4ce39b6980ef281e693b
